html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;lss-particle-flow&quot;&gt;
  &lt;style&gt;
    #lss-particle-flow {
      display: grid;
      gap: 12px;
      width: 100%;
      color: var(--foreground);
    }

    #lss-particle-flow .lss-stage {
      position: relative;
      min-width: 0;
    }

    #lss-particle-flow canvas {
      display: block;
      width: 100%;
    }
  &lt;/style&gt;

  &lt;h2&gt;Particle flow in a two-dimensional universe&lt;/h2&gt;

  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lss-seed&quot;&gt;
      Seed
      &lt;input class=&quot;form-control&quot; id=&quot;lss-seed&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;4294967295&quot; step=&quot;1&quot; value=&quot;77&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lss-count&quot;&gt;
      Particles
      &lt;input class=&quot;form-control&quot; id=&quot;lss-count&quot; type=&quot;number&quot; min=&quot;4&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;32&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lss-time&quot;&gt;
      &lt;span&gt;Time &lt;var&gt;t&lt;/var&gt;&lt;/span&gt;
      &lt;output id=&quot;lss-time-value&quot; for=&quot;lss-time&quot;&gt;0.00&lt;/output&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;lss-time&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;1&quot; value=&quot;0&quot; aria-label=&quot;Time t from 0 to 1&quot;&gt;
    &lt;/label&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;lss-play&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Play&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;lss-stage&quot;&gt;
    &lt;canvas id=&quot;lss-canvas&quot; role=&quot;img&quot; aria-describedby=&quot;lss-summary&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
  &lt;p class=&quot;sr-only&quot; id=&quot;lss-summary&quot;&gt;A perspective view of a periodic two-dimensional particle universe. Uniform random initial positions lie on the top plane at time zero, final positions lie on the bottom plane at time one, and curves show each particle trajectory.&lt;/p&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;lss-particle-flow&quot;);
  if (!root || root.dataset.initialized === &quot;true&quot;) return;
  root.dataset.initialized = &quot;true&quot;;

  const canvas = root.querySelector(&quot;#lss-canvas&quot;);
  const ctx = canvas.getContext(&quot;2d&quot;);
  const stage = root.querySelector(&quot;.lss-stage&quot;);
  const seedInput = root.querySelector(&quot;#lss-seed&quot;);
  const countInput = root.querySelector(&quot;#lss-count&quot;);
  const timeInput = root.querySelector(&quot;#lss-time&quot;);
  const timeValue = root.querySelector(&quot;#lss-time-value&quot;);
  const playButton = root.querySelector(&quot;#lss-play&quot;);
  const summary = root.querySelector(&quot;#lss-summary&quot;);
  const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
  const colorScheme = window.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const FRAME_COUNT = 181;
  const PLAY_DURATION = 9000;
  let tracks = [];
  let particleCount = 32;
  let seed = 77;
  let time = 0;
  let playing = false;
  let animationFrame = 0;
  let animationOrigin = 0;
  let width = 736;
  let height = 580;
  let colors = {};

  function clamp(value, minimum, maximum) {
    return Math.max(minimum, Math.min(maximum, value));
  }

  function wrap(value) {
    return ((value % 1) + 1) % 1;
  }

  function mulberry32(initialSeed) {
    let state = initialSeed &gt;&gt;&gt; 0;
    return function random() {
      state |= 0;
      state = state + 0x6D2B79F5 | 0;
      let value = Math.imul(state ^ state &gt;&gt;&gt; 15, 1 | state);
      value = value + Math.imul(value ^ value &gt;&gt;&gt; 7, 61 | value) ^ value;
      return ((value ^ value &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296;
    };
  }

  function mixSeed(simulationSeed, count) {
    let value = (simulationSeed ^ Math.imul(count, 0x9E3779B1)) &gt;&gt;&gt; 0;
    value = Math.imul(value ^ value &gt;&gt;&gt; 16, 0x21F0AAAD);
    value = Math.imul(value ^ value &gt;&gt;&gt; 15, 0x735A2D97);
    return (value ^ value &gt;&gt;&gt; 15) &gt;&gt;&gt; 0;
  }

  function gaussian(random) {
    const first = Math.max(Number.EPSILON, random());
    const second = random();
    return Math.sqrt(-2 * Math.log(first)) * Math.cos(2 * Math.PI * second);
  }

  function coherentVelocities(points, random) {
    const wavevectors = [
      [1, 0], [0, 1], [1, 1], [1, -1], [2, 1], [1, 2], [2, -1], [-1, 2]
    ];
    const modes = wavevectors.map(([kx, ky]) =&gt; ({
      kx,
      ky,
      phase: 2 * Math.PI * random(),
      amplitude: gaussian(random) / (kx * kx + ky * ky)
    }));

    const values = points.map((point) =&gt; {
      let dx = 0;
      let dy = 0;
      for (const mode of modes) {
        const angle = 2 * Math.PI * (mode.kx * point.x + mode.ky * point.y) + mode.phase;
        const gradient = -mode.amplitude * Math.sin(angle);
        dx += mode.kx * gradient;
        dy += mode.ky * gradient;
      }
      dx += 0.08 * gaussian(random);
      dy += 0.08 * gaussian(random);
      return { x: dx, y: dy };
    });

    const maximum = Math.max(...values.map((value) =&gt; Math.hypot(value.x, value.y)), Number.EPSILON);
    return values.map((value) =&gt; ({ x: value.x / maximum, y: value.y / maximum }));
  }

  function accelerations(positions, softening, gravity) {
    const result = positions.map(() =&gt; ({ x: 0, y: 0 }));
    const mass = 1 / positions.length;
    for (let i = 0; i &lt; positions.length; i += 1) {
      for (let j = i + 1; j &lt; positions.length; j += 1) {
        let dx = positions[j].x - positions[i].x;
        let dy = positions[j].y - positions[i].y;
        dx -= Math.round(dx);
        dy -= Math.round(dy);
        const inverseRadiusCubed = 1 / Math.pow(dx * dx + dy * dy + softening * softening, 1.5);
        const factor = gravity * mass * inverseRadiusCubed;
        const ax = factor * dx;
        const ay = factor * dy;
        result[i].x += ax;
        result[i].y += ay;
        result[j].x -= ax;
        result[j].y -= ay;
      }
    }
    return result;
  }

  function simulate(count, simulationSeed) {
    const random = mulberry32(mixSeed(simulationSeed, count));
    let positions = Array.from({ length: count }, () =&gt; ({
      x: random(),
      y: random()
    }));
    const velocityField = coherentVelocities(positions, random);
    let velocities = velocityField.map((value) =&gt; ({
      x: 0.055 * value.x,
      y: 0.055 * value.y
    }));

    const snapshots = [positions.map((point) =&gt; ({ ...point }))];
    const physicalDuration = 2.5;
    const step = physicalDuration / (FRAME_COUNT - 1);
    const softening = clamp(0.18 / Math.sqrt(count), 0.018, 0.065);
    const gravity = 0.085;
    let force = accelerations(positions, softening, gravity);

    for (let index = 0; index &lt; velocities.length; index += 1) {
      velocities[index].x += 0.5 * step * force[index].x;
      velocities[index].y += 0.5 * step * force[index].y;
    }

    for (let frame = 1; frame &lt; FRAME_COUNT; frame += 1) {
      positions = positions.map((point, index) =&gt; ({
        x: wrap(point.x + step * velocities[index].x),
        y: wrap(point.y + step * velocities[index].y)
      }));
      force = accelerations(positions, softening, gravity);
      for (let index = 0; index &lt; velocities.length; index += 1) {
        velocities[index].x += step * force[index].x;
        velocities[index].y += step * force[index].y;
      }
      snapshots.push(positions.map((point) =&gt; ({ ...point })));
    }

    return Array.from({ length: count }, (_, particle) =&gt;
      snapshots.map((snapshot) =&gt; snapshot[particle])
    );
  }

  function resolveColor(variable) {
    const probe = document.createElement(&quot;span&quot;);
    probe.style.color = `var(${variable})`;
    probe.style.position = &quot;absolute&quot;;
    probe.style.visibility = &quot;hidden&quot;;
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }

  function resolveColors() {
    colors = {
      foreground: resolveColor(&quot;--foreground&quot;),
      muted: resolveColor(&quot;--muted-foreground&quot;),
      series: resolveColor(&quot;--viz-series-1&quot;)
    };
  }

  function geometry() {
    const xAxis = { x: 0.4 * width, y: 0.071 * width };
    const yAxis = { x: 0.331 * width, y: -0.233 * width };
    const topMargin = 16;
    const bottomMargin = 16;
    const topOrigin = {
      x: 0.135 * width,
      y: topMargin - yAxis.y
    };
    const bottomOfTopPlane = topOrigin.y + xAxis.y;
    return {
      origin: topOrigin,
      xAxis,
      yAxis,
      timeAxis: { x: 0, y: Math.max(120, height - bottomMargin - bottomOfTopPlane) }
    };
  }

  function project(x, y, currentTime, layout) {
    return {
      x: layout.origin.x + x * layout.xAxis.x + y * layout.yAxis.x + currentTime * layout.timeAxis.x,
      y: layout.origin.y + x * layout.xAxis.y + y * layout.yAxis.y + currentTime * layout.timeAxis.y
    };
  }

  function drawPlane(currentTime, layout, emphasis = false) {
    ctx.save();
    ctx.strokeStyle = emphasis ? colors.series : colors.muted;
    ctx.lineWidth = emphasis ? 1.1 : 0.8;
    ctx.globalAlpha = emphasis ? 0.28 : 0.38;

    const divisions = 6;
    for (let division = 0; division &lt;= divisions; division += 1) {
      const fraction = division / divisions;
      const horizontalStart = project(0, fraction, currentTime, layout);
      const horizontalEnd = project(1, fraction, currentTime, layout);
      const verticalStart = project(fraction, 0, currentTime, layout);
      const verticalEnd = project(fraction, 1, currentTime, layout);

      ctx.beginPath();
      ctx.moveTo(horizontalStart.x, horizontalStart.y);
      ctx.lineTo(horizontalEnd.x, horizontalEnd.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(verticalStart.x, verticalStart.y);
      ctx.lineTo(verticalEnd.x, verticalEnd.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function segmentCrossesBoundary(first, second) {
    return Math.abs(second.x - first.x) &gt; 0.5 || Math.abs(second.y - first.y) &gt; 0.5;
  }

  function drawTrack(track, endFrame, layout, strokeStyle, lineWidth, alpha) {
    const finalWholeFrame = Math.floor(endFrame);
    const fraction = endFrame - finalWholeFrame;
    ctx.save();
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lineWidth;
    ctx.globalAlpha = alpha;
    ctx.lineCap = &quot;round&quot;;
    ctx.lineJoin = &quot;round&quot;;
    ctx.beginPath();
    let active = false;

    for (let frame = 0; frame &lt;= finalWholeFrame &amp;&amp; frame &lt; track.length; frame += 1) {
      if (frame &gt; 0 &amp;&amp; segmentCrossesBoundary(track[frame - 1], track[frame])) active = false;
      const point = project(track[frame].x, track[frame].y, frame / (FRAME_COUNT - 1), layout);
      if (!active) {
        ctx.moveTo(point.x, point.y);
        active = true;
      } else {
        ctx.lineTo(point.x, point.y);
      }
    }

    if (fraction &gt; 0 &amp;&amp; finalWholeFrame &lt; track.length - 1) {
      const first = track[finalWholeFrame];
      const second = track[finalWholeFrame + 1];
      if (!segmentCrossesBoundary(first, second)) {
        const x = first.x + fraction * (second.x - first.x);
        const y = first.y + fraction * (second.y - first.y);
        const point = project(x, y, endFrame / (FRAME_COUNT - 1), layout);
        ctx.lineTo(point.x, point.y);
      }
    }

    ctx.stroke();
    ctx.restore();
  }

  function currentPosition(track, framePosition) {
    const firstFrame = Math.min(FRAME_COUNT - 1, Math.floor(framePosition));
    const secondFrame = Math.min(FRAME_COUNT - 1, firstFrame + 1);
    const fraction = framePosition - firstFrame;
    const first = track[firstFrame];
    const second = track[secondFrame];
    let dx = second.x - first.x;
    let dy = second.y - first.y;
    dx -= Math.round(dx);
    dy -= Math.round(dy);
    return {
      x: wrap(first.x + fraction * dx),
      y: wrap(first.y + fraction * dy)
    };
  }

  function drawDot(point, radius, fill, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, 2 * Math.PI);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!tracks.length || !width || !height) return;
    ctx.clearRect(0, 0, width, height);
    const layout = geometry();
    const framePosition = time * (FRAME_COUNT - 1);

    drawPlane(0, layout);
    drawPlane(1, layout);
    if (time &gt; 0.015 &amp;&amp; time &lt; 0.985) drawPlane(time, layout, true);

    for (const track of tracks) {
      drawTrack(track, FRAME_COUNT - 1, layout, colors.muted, 0.75, 0.22);
    }
    for (const track of tracks) {
      drawTrack(track, framePosition, layout, colors.series, 0.8, 0.9);
    }

    for (const track of tracks) {
      const initial = project(track[0].x, track[0].y, 0, layout);
      const final = project(track[FRAME_COUNT - 1].x, track[FRAME_COUNT - 1].y, 1, layout);
      drawDot(initial, 2.1, colors.foreground, 0.58);
      drawDot(final, 2.1, colors.foreground, 0.58);
    }

    const currentParticles = tracks.map((track) =&gt; {
      const position = currentPosition(track, framePosition);
      return {
        position,
        projected: project(position.x, position.y, time, layout)
      };
    }).sort((first, second) =&gt; first.position.y - second.position.y);

    for (const particle of currentParticles) {
      drawDot(particle.projected, 3.25, colors.series);
    }
  }

  function updateTime(nextTime, updateSlider = true) {
    time = clamp(nextTime, 0, 1);
    if (updateSlider) timeInput.value = String(Math.round(1000 * time));
    timeValue.value = time.toFixed(2);
    playButton.textContent = time &gt;= 1 &amp;&amp; !playing ? &quot;Replay&quot; : (playing ? &quot;Pause&quot; : &quot;Play&quot;);
    playButton.setAttribute(&quot;aria-pressed&quot;, String(playing));
    draw();
  }

  function stopPlayback() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    playButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    playButton.textContent = time &gt;= 1 ? &quot;Replay&quot; : &quot;Play&quot;;
  }

  function animationStep(timestamp) {
    if (!playing) return;
    const nextTime = (timestamp - animationOrigin) / PLAY_DURATION;
    if (nextTime &gt;= 1) {
      playing = false;
      updateTime(1);
      return;
    }
    updateTime(nextTime);
    animationFrame = requestAnimationFrame(animationStep);
  }

  function startPlayback() {
    if (playing) {
      stopPlayback();
      return;
    }
    if (time &gt;= 1) updateTime(0);
    playing = true;
    animationOrigin = performance.now() - time * PLAY_DURATION;
    playButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
    playButton.textContent = &quot;Pause&quot;;
    animationFrame = requestAnimationFrame(animationStep);
  }

  function resetSimulation(autoplay) {
    stopPlayback();
    seed = clamp(Math.trunc(Number(seedInput.value) || 0), 0, 4294967295);
    particleCount = clamp(Math.trunc(Number(countInput.value) || 32), 4, 100);
    seedInput.value = String(seed);
    countInput.value = String(particleCount);
    tracks = simulate(particleCount, seed);
    summary.textContent = `${particleCount} seeded particles move through a periodic two-dimensional universe. Uniform random initial positions lie on the top plane at time zero, final positions lie on the bottom plane at time one, and curves show each trajectory.`;
    updateTime(0);
    if (autoplay &amp;&amp; !reducedMotion.matches) {
      window.setTimeout(() =&gt; {
        if (time === 0 &amp;&amp; !playing) startPlayback();
      }, 250);
    }
  }

  function resize() {
    const bounds = stage.getBoundingClientRect();
    width = Math.max(1, Math.round(bounds.width));
    height = width &lt; 500 ? 500 : Math.min(610, Math.round(width * 0.8));
    const ratio = Math.min(2, window.devicePixelRatio || 1);
    canvas.style.height = `${height}px`;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    resolveColors();
    draw();
  }

  playButton.addEventListener(&quot;click&quot;, startPlayback);
  timeInput.addEventListener(&quot;input&quot;, () =&gt; {
    stopPlayback();
    updateTime(Number(timeInput.value) / 1000, false);
  });
  seedInput.addEventListener(&quot;change&quot;, () =&gt; resetSimulation(false));
  countInput.addEventListener(&quot;change&quot;, () =&gt; resetSimulation(false));

  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(stage);
  reducedMotion.addEventListener?.(&quot;change&quot;, () =&gt; {
    if (reducedMotion.matches) stopPlayback();
  });
  colorScheme.addEventListener?.(&quot;change&quot;, () =&gt; {
    resolveColors();
    draw();
  });

  resolveColors();
  resetSimulation(false);
  resize();
})();
&lt;/script&gt;

(() =&gt; {
